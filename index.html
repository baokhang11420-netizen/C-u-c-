                <h2 class="text-xl font-black text-white">Cửa Hàng Ngư Cụ</h2>
                    <button id="btn-close-shop" class="text-slate-400 hover:text-white text-2xl w-8 h-8 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="shop-items-list" class="overflow-y-auto custom-scroll space-y-3 py-4 flex-1">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Fish Album Modal -->
        <div id="album-modal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-md z-40 flex items-center justify-center p-4">
            <div class="glass-panel max-w-xl w-full p-6 rounded-3xl border border-sky-500/30 flex flex-col max-h-[85vh]">
                <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-book-bookmark text-sky-400 text-xl"></i>
                        <h2 class="text-xl font-black text-white">Sách Cẩm Nang Cá</h2>
                    </div>
                    <button id="btn-close-album" class="text-slate-400 hover:text-white text-2xl w-8 h-8 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="album-items-list" class="overflow-y-auto custom-scroll grid grid-cols-1 sm:grid-cols-2 gap-3 py-4 flex-1">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Bottom Tension Bar for Reeling (Interactive Fishing Fight) -->
        <div id="reeling-ui" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-md glass-panel p-4 rounded-3xl border-2 border-red-500/50 shadow-2xl z-30 text-center">
            <div class="flex justify-between items-center mb-1 text-xs font-bold text-amber-300">
                <span><i class="fa-solid fa-fish-fins mr-1"></i> KÉO CÁ ĐỐI KHÁNG</span>
                <span id="tension-percent">30%</span>
            </div>
            <!-- Tension Track -->
            <div class="w-full bg-slate-900 h-5 rounded-full overflow-hidden p-0.5 border border-red-500/30 relative">
                <div id="tension-fill" class="h-full bg-gradient-to-r from-emerald-500 via-yellow-400 to-red-600 rounded-full w-1/3 transition-all duration-75"></div>
            </div>
            <div class="mt-2 text-[11px] text-slate-300 flex justify-between items-center px-1">
                <span>Giữ phím hoặc chạm liên tục để kéo!</span>
                <span class="text-red-400 font-bold">Tránh vạch đỏ!</span>
            </div>
            <button id="btn-pull" class="btn-action w-full mt-3 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-black py-3 rounded-xl uppercase tracking-wider text-sm shadow-lg">
                <i class="fa-solid fa-hand-fist mr-1"></i> GIỮ KÉO DÂY (REEL)
            </button>
        </div>

        <!-- Main Cast Button (Bottom Center) -->
        <div id="action-ui" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30">
            <button id="btn-cast" class="btn-action bg-gradient-to-r from-emerald-500 via-teal-400 to-emerald-600 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-black px-10 py-4 rounded-full text-xl shadow-2xl border-4 border-emerald-300 tracking-wider flex items-center space-x-3">
                <i class="fa-solid fa-water text-2xl"></i>
                <span>THẢ CẦN CÂU</span>
            </button>
        </div>
    </div>

    <script>
        // --- GAME SYSTEM CONFIG & DATABASE ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Resize Canvas to fit container
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game States: IDLE, CASTING, WAITING, BITE, REELING, CATCHING
        let gameState = "IDLE";
        
        let player = {
            name: "Lão Ngư Tôn",
            title: "Tân Thủ",
            avatar: "👴",
            level: 1,
            exp: 0,
            expMax: 100,
            energy: 100,
            maxEnergy: 100,
            gold: 150,
            score: 0,
            buffText: "+20% Giảm căng dây",
            perkBonus: 0.2,
            selectedCharIndex: 0
        };

        const charactersList = [
            { name: "Lão Ngư Tôn", title: "Cần Thủ Kỳ Cựu", avatar: "👴", perk: "+20% Lực Kéo & Giảm căng dây", bonus: 0.2, unlocked: true, desc: "Bậc thầy sông nước với kinh nghiệm dày dặn." },
            { name: "Dũng Sĩ Biển", title: "Săn Cá Mập", avatar: "🧔", perk: "+35% Tỷ lệ dính cá khủng", bonus: 0.35, unlocked: false, price: 1000, desc: "Chuyên gia chinh phục các loài cá hạng nặng dưới đáy sâu." },
            { name: "Cô Tiên Cá", title: "Mỹ Nhân Ngư", avatar: "🧜‍♀️", perk: "Hồi 2x Thể lực & May mắn", bonus: 0.5, unlocked: false, price: 2500, desc: "Được ban phước từ đại dương, thu hút cá hiếm và huyền thoại." }
        ];

        // Fishing Rods & Baits Equipment Shop
        let shopItems = [
            { id: 'rod_carbon', type: 'rod', name: 'Cần Carbon Siêu Cứng', desc: 'Tăng 50% độ bền dây, chịu lực cá lớn cực tốt.', price: 500, owned: false, level: 2 },
            { id: 'rod_diamond', type: 'rod', name: 'Cần Kim Cương Huyền Thoại', desc: 'Cần tối thượng, câu cá mập và cá voi cực mượt.', price: 2000, owned: false, level: 3 },
            { id: 'bait_shrimp', type: 'bait', name: 'Hộp Tôm Sống Thượng Hạng', desc: 'Tăng mạnh tỷ lệ câu trúng cá hiếm (Rarity 3 & 4).', price: 200, owned: false, count: 5 },
            { id: 'bait_magic', type: 'bait', name: 'Mồi Thần Dược Đại Dương', desc: 'Thu hút tuyệt đối Cá Voi Huyền Thoại xuất hiện.', price: 800, owned: false, count: 3 }
        ];

        let equippedRod = { name: "Cần Tre Truyền Thống", power: 1, level: 1 };
        let activeBait = null;

        // Fish Database (Hạng cân từ Nhẹ đến Huyền Thoại)
        const fishDatabase = [
            { id: 'rophi', name: "Cá Rô Phi Sông", tier: "Hạng Nhẹ", rarity: "PHỔ THÔNG", icon: "🐟", color: "from-blue-600 to-cyan-500", minW: 0.5, maxW: 2.0, gold: 30, exp: 15, catchRate: 0.4 },
            { id: 'chep', name: "Cá Chép Vàng", tier: "Hạng Trung", rarity: "TRUNG BÌNH", icon: "🐠", color: "from-amber-500 to-yellow-400", minW: 2.1, maxW: 6.5, gold: 90, exp: 40, catchRate: 0.3 },
            { id: 'loc', name: "Cá Quả Khổng Lồ", tier: "Hạng Nặng", rarity: "CỰC HIẾM", icon: "🐡", color: "from-purple-600 to-pink-500", minW: 6.6, maxW: 15.0, gold: 250, exp: 100, catchRate: 0.18 },
            { id: 'shark', name: "Cá Mập Nước Lợ", tier: "Hạng Siêu Nặng", rarity: "HUYỀN THOẠI", icon: "🦈", color: "from-red-600 to-orange-500", minW: 15.1, maxW: 45.0, gold: 700, exp: 300, catchRate: 0.08 },
            { id: 'whale', name: "Cá Voi Sông Xanh", tier: "Hạng Tối Thượng", rarity: "SIÊU THẦN THOẠI", icon: "🐳", color: "from-emerald-500 to-teal-400", minW: 50.0, maxW: 150.0, gold: 2000, exp: 800, catchRate: 0.04 }
        ];

        let fishAlbum = {}; // Lưu trữ kỷ lục cá đã câu

        // Animation & Physics Variables
        let boat = { x: 0, y: 0, bobSpeed: 0.04, bobAngle: 0 };
        let float = { x: 0, y: 0, targetX: 0, targetY: 0, progress: 1, active: false };
        let tension = 30;
        let hookedFish = null;
        let biteTimer = null;
        let particles = [];
        let animationTime = 0;

        // --- INIT GAME ---
        function initGame() {
            updateHUD();
            renderShopItems();
            renderAlbumItems();
            renderCharacterList();
            setupEventListeners();
            requestAnimationFrame(gameLoop);
        }

        // --- DOM EVENT LISTENERS ---
        function setupEventListeners() {
            document.getElementById("btn-cast").addEventListener("click", startCasting);
            document.getElementById("btn-pull").addEventListener("mousedown", handleReelAction);
            document.getElementById("btn-pull").addEventListener("touchstart", (e) => { e.preventDefault(); handleReelAction(); });
            
            // Keyboard Controls
            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    if (gameState === "IDLE") startCasting();
                    else if (gameState === "BITE") triggerReeling();
                    else if (gameState === "REELING") handleReelAction();
                }
            });

            // Modals toggle
            document.getElementById("character-card-btn").addEventListener("click", () => document.getElementById("char-modal").classList.remove("hidden"));
            document.getElementById("btn-close-char").addEventListener("click", () => document.getElementById("char-modal").classList.add("hidden"));
            
            document.getElementById("btn-open-shop").addEventListener("click", () => document.getElementById("shop-modal").classList.remove("hidden"));
            document.getElementById("btn-close-shop").addEventListener("click", () => document.getElementById("shop-modal").classList.add("hidden"));
            
            document.getElementById("btn-open-album").addEventListener("click", () => document.getElementById("album-modal").classList.remove("hidden"));
            document.getElementById("btn-close-album").addEventListener("click", () => document.getElementById("album-modal").classList.add("hidden"));

            document.getElementById("btn-collect").addEventListener("click", () => {
                document.getElementById("catch-modal").classList.add("hidden");
                gameState = "IDLE";
                document.getElementById("action-ui").classList.remove("hidden");
            });

            document.getElementById("btn-claim-level3-gift").addEventListener("click", () => {
                player.gold += 2000;
                player.energy = player.maxEnergy;
                equippedRod = { name: "Cần Carbon Siêu Cứng", power: 2, level: 2 };
                document.getElementById("level3-gift-modal").classList.add("hidden");
                updateHUD();
                showFloatingText("🎁 Đã nhận Quà Tân Thủ Level 3 thành công!", "text-yellow-400");
            });

            document.getElementById("btn-restore-energy").addEventListener("click", () => {
                if (player.gold >= 30) {
                    player.gold -= 30;
                    player.energy = player.maxEnergy;
                    updateHUD();
                    showFloatingText("⚡ Đã hồi đầy 100% Thể lực!", "text-emerald-400");
                } else {
                    alert("Không đủ vàng để hồi thể lực!");
                }
            });
        }

        // --- HUD & UI UPDATES ---
        function updateHUD() {
            document.getElementById("gold-val").innerText = player.gold;
            document.getElementById("score-val").innerText = player.score;
            document.getElementById("player-level").innerText = `Lv.${player.level}`;
            document.getElementById("hud-char-name").innerText = player.name;
            document.getElementById("hud-char-title").innerText = player.title;
            document.getElementById("hud-avatar-box").innerText = player.avatar;
            
            // Energy bar
            let energyPct = (player.energy / player.maxEnergy) * 100;
            document.getElementById("energy-bar").style.width = `${energyPct}%`;
            document.getElementById("energy-text").innerText = `${Math.floor(player.energy)}/${player.maxEnergy}`;

            // Exp bar
            let expPct = (player.exp / player.expMax) * 100;
            document.getElementById("exp-bar").style.width = `${expPct}%`;

            // Check level 3 trigger
            if (player.level >= 3 && !window.level3ClaimedChecked) {
                window.level3ClaimedChecked = true;
                document.getElementById("level3-gift-modal").classList.remove("hidden");
            }
        }

        function addExp(amount) {
            player.exp += amount;
            if (player.exp >= player.expMax) {
                player.exp -= player.expMax;
                player.level++;
                player.expMax = Math.floor(player.expMax * 1.4);
                showFloatingText(`🎉 LÊN CẤP ĐỘ ${player.level}!`, "text-yellow-400");
            }
            updateHUD();
        }

        function showFloatingText(text, colorClass) {
            let div = document.createElement("div");
            div.className = `absolute top-1/4 left-1/2 -translate-x-1/2 font-black text-2xl sm:text-3xl ${colorClass} drop-shadow-lg z-50 transition-all duration-1000 pointer-events-none`;
            div.innerText = text;
            document.getElementById("game-container").appendChild(div);
            setTimeout(() => {
                div.style.transform = "translate(-50%, -60px)";
                div.style.opacity = "0";
            }, 50);
            setTimeout(() => div.remove(), 1100);
        }

        // --- RENDER SHOPS & ALBUMS ---
        function renderShopItems() {
            let container = document.getElementById("shop-items-list");
            container.innerHTML = "";
            shopItems.forEach((item, idx) => {
                container.innerHTML += `
                    <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-amber-500/30 flex justify-between items-center">
                        <div>
                            <div class="font-extrabold text-white text-sm">${item.name}</div>
                            <div class="text-[11px] text-amber-200/70 mt-0.5">${item.desc}</div>
                        </div>
                        <button onclick="buyShopItem(${idx})" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs flex items-center space-x-1.5 shadow">
                            <i class="fa-solid fa-coins"></i>
                            <span>${item.price}</span>
                        </button>
                    </div>
                `;
            });
        }

        function buyShopItem(idx) {
            let item = shopItems[idx];
            if (player.gold >= item.price) {
                player.gold -= item.price;
                if (item.type === 'rod') {
                    equippedRod = { name: item.name, power: item.level, level: item.level };
                    showFloatingText(`🎣 Đã trang bị ${item.name}!`, "text-amber-300");
                } else if (item.type === 'bait') {
                    activeBait = item;
                    showFloatingText(`🍤 Đã chọn mồi ${item.name}!`, "text-sky-300");
                }
                updateHUD();
                renderShopItems();
            } else {
                alert("Không đủ vàng để mua vật phẩm này!");
            }
        }

        function renderAlbumItems() {
            let container = document.getElementById("album-items-list");
            container.innerHTML = "";
            fishDatabase.forEach(fish => {
                let caughtData = fishAlbum[fish.id];
                container.innerHTML += `
                    <div class="bg-slate-900/80 p-3 rounded-2xl border border-sky-500/30 flex items-center space-x-3">
                        <div class="text-4xl w-12 h-12 flex items-center justify-center bg-slate-800 rounded-xl">${fish.icon}</div>
                        <div class="flex-1">
                            <div class="font-black text-white text-sm">${fish.name}</div>
                            <div class="text-[10px] text-sky-400">${fish.tier} • ${fish.rarity}</div>
                            <div class="text-[11px] text-slate-300 mt-1">Kỷ lục: <strong class="text-yellow-400">${caughtData ? caughtData.maxWeight + ' kg' : 'Chưa bắt'}</strong> (Bắt: ${caughtData ? caughtData.count : 0})</div>
                        </div>
                    </div>
                `;
            });
        }

        function renderCharacterList() {
            let container = document.getElementById("character-select-list");
            container.innerHTML = "";
            charactersList.forEach((char, idx) => {
                let isSelected = player.selectedCharIndex === idx;
                container.innerHTML += `
                    <div class="p-3 rounded-2xl border ${isSelected ? 'border-amber-400 bg-amber-500/10' : 'border-slate-800 bg-slate-900/60'} flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="text-3xl w-12 h-12 flex items-center justify-center bg-slate-800 rounded-xl">${char.avatar}</div>
                            <div>
                                <div class="font-bold text-white text-sm flex items-center space-x-2">
                                    <span>${char.name}</span>
                                    ${isSelected ? '<span class="bg-emerald-500 text-slate-950 text-[10px] px-1.5 py-0.5 rounded font-black">Đang dùng</span>' : ''}
                                </div>
                                <div class="text-[11px] text-amber-300">${char.perk}</div>
                            </div>
                        </div>
                        <div>
                            ${char.unlocked ? 
                                (!isSelected ? `<button onclick="selectCharacter(${idx})" class="btn-action bg-sky-600 hover:bg-sky-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs">Chọn</button>` : '') :
                                `<button onclick="unlockCharacter(${idx})" class="btn-action bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs">${char.price} 🪙</button>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        function selectCharacter(idx) {
            player.selectedCharIndex = idx;
            let char = charactersList[idx];
            player.name = char.name;
            player.title = char.title;
            player.avatar = char.avatar;
            player.perkBonus = char.bonus;
            updateHUD();
            renderCharacterList();
            document.getElementById("modal-char-name").innerText = char.name;
            document.getElementById("modal-char-avatar").innerText = char.avatar;
            document.getElementById("modal-char-desc").innerText = char.desc;
            document.getElementById("modal-char-perk-tag").innerText = char.perk;
            showFloatingText(`✨ Đã đổi sang nhân vật ${char.name}!`, "text-amber-300");
        }

        function unlockCharacter(idx) {
            let char = charactersList[idx];
            if (player.gold >= char.price) {
                player.gold -= char.price;
                char.unlocked = true;
                selectCharacter(idx);
                renderCharacterList();
            } else {
                alert("Không đủ vàng để mở khóa nhân vật này!");
            }
        }

        // --- FISHING GAMEPLAY CORE LOOP ---
        function startCasting() {
            if (player.energy < 5) {
                alert("Thể lực đã cạn! Hãy nghỉ ngơi hoặc mua thức ăn hồi thể lực.");
                return;
            }
            player.energy -= 5;
            updateHUD();

            gameState = "CASTING";
            document.getElementById("action-ui").classList.add("hidden");
            
            // Set float target in water area
            float.targetX = canvas.width * 0.55 + Math.random() * (canvas.width * 0.3);
            float.t
